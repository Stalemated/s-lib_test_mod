modLoader = "javafml"
loaderVersion = "[1,)"
issueTrackerURL = "${sources}/issues"
license = "MIT"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "${author}"
description = '''
${description}
'''
${icon_key} = "assets/${id}/icon.png"
displayURL = "${sources}"

[[mixins]]
config = "${id}.mixins.json"

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "s_lib"
type = "required"
versionRange = "[${slib},)"
ordering = "AFTER"
side = "BOTH"
