modLoader = "javafml"
loaderVersion = "[47,)"
issueTrackerURL = "${sources}/issues"
license = "MIT"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "${author}"
description = '''
${description}
'''
logoFile = "assets/${id}/icon.png"
displayURL = "${sources}"

[[mixins]]
config = "${id}.mixins.json"

[[dependencies.${id}]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "s_lib"
mandatory = true
versionRange = "[${slib},)"
ordering = "AFTER"
side = "BOTH"
